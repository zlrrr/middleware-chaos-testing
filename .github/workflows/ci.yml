name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: |
          # Run unit tests only, excluding evaluator, middleware clients, integration, and e2e tests
          # Middleware client tests require actual services running (integration tests)
          go test -v -race -coverprofile=coverage.txt -covermode=atomic \
            $(go list ./... | grep -v 'tests/unit/evaluator' | grep -v 'tests/unit/middleware' | grep -v 'tests/integration' | grep -v 'tests/e2e')

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --config=.golangci.yml
        continue-on-error: true  # Don't fail build on lint warnings

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Build mct CLI
        run: go build -v -o bin/mct ./cmd/mct

      - name: Build mct-server
        run: go build -v -o bin/mct-server ./cmd/mct-server

      - name: Test mct version
        run: ./bin/mct --version

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Check build output
        run: |
          ls -lh web/dist/
          test -f web/dist/index.html

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/mct ./cmd/mct
          go build -o bin/mct-server ./cmd/mct-server

      - name: Run API integration tests
        run: go test -v ./tests/integration/api/... -count=1

      - name: Run CLI basic tests
        run: |
          # Run CLI tests that don't require middleware (using short mode to skip those)
          go test -v ./tests/integration -run "TestCLI_(Version|Help|TestCommand_Help|MissingRequiredFlag|UnsupportedMiddleware)" -count=1

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: mct-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: mct-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
